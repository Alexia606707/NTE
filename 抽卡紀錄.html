<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NTE 異環 抽卡紀錄</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --bg-dark: #050810;
            --bg-card: rgba(0,229,255,0.03);
            --border: rgba(0,229,255,0.12);
            --accent: #00e5ff;
            --cyan: #00e5ff;
            --teal: #1de9b6;
            --gold: #ffd740;
            --purple: #b388ff;
            --red: #ff5252;
            --blue: #448aff;
            --orange: #ffab40;
            --green: #69f0ae;
            --text: #e0e0e0;
            --text-dim: #7c8aaa;
            --grade-s: #ffd740;
            --grade-a: #b388ff;
            --grade-b: #448aff;
            --neon-cyan: 0,229,255;
            --neon-teal: 29,233,182;
            --neon-purple: 179,136,255;
        }
        body {
            font-family: 'Microsoft JhengHei','Segoe UI',system-ui,sans-serif;
            background: radial-gradient(ellipse at 20% 0%, rgba(0,229,255,.06) 0%, transparent 50%),
                        radial-gradient(ellipse at 80% 100%, rgba(179,136,255,.05) 0%, transparent 50%),
                        radial-gradient(ellipse at 50% 50%, rgba(29,233,182,.03) 0%, transparent 60%),
                        linear-gradient(180deg, #050810 0%, #0a1018 30%, #080d16 60%, #050810 100%);
            background-attachment: fixed;
            min-height: 100vh; padding: 30px 16px; color: var(--text);
            position: relative;
        }
        /* 背景網格 + 掃描線 */
        body::before {
            content:''; position:fixed; top:0; left:0; right:0; bottom:0; z-index:0; pointer-events:none;
            background:
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,229,255,.015) 2px, rgba(0,229,255,.015) 4px),
                repeating-linear-gradient(0deg, transparent, transparent 60px, rgba(0,229,255,.03) 60px, rgba(0,229,255,.03) 61px),
                repeating-linear-gradient(90deg, transparent, transparent 60px, rgba(0,229,255,.03) 60px, rgba(0,229,255,.03) 61px);
            animation: bgScan 8s linear infinite;
        }
        @keyframes bgScan {
            0% { background-position:0 0; }
            100% { background-position:0 120px; }
        }
        /* 漂浮光點 */
        body::after {
            content:''; position:fixed; top:0; left:0; right:0; bottom:0; z-index:0; pointer-events:none;
            background:
                radial-gradient(3px 3px at 8% 15%, rgba(0,229,255,0.5), transparent),
                radial-gradient(2px 2px at 25% 55%, rgba(29,233,182,0.4), transparent),
                radial-gradient(3px 3px at 65% 25%, rgba(179,136,255,0.4), transparent),
                radial-gradient(2px 2px at 82% 65%, rgba(0,229,255,0.45), transparent),
                radial-gradient(3px 3px at 45% 80%, rgba(255,215,64,0.3), transparent),
                radial-gradient(2px 2px at 15% 40%, rgba(0,229,255,0.3), transparent),
                radial-gradient(1px 1px at 55% 10%, rgba(29,233,182,0.3), transparent),
                radial-gradient(2px 2px at 92% 45%, rgba(179,136,255,0.3), transparent),
                radial-gradient(1px 1px at 35% 70%, rgba(0,229,255,0.25), transparent),
                radial-gradient(2px 2px at 75% 90%, rgba(29,233,182,0.2), transparent);
            animation: floatDots 15s ease-in-out infinite alternate;
        }
        @keyframes floatDots {
            0% { opacity:0.5; transform:translateY(0) scale(1); }
            50% { opacity:1; transform:translateY(-15px) scale(1.02); }
            100% { opacity:0.7; transform:translateY(-25px) scale(1); }
        }

        .container { max-width: 1100px; margin: 0 auto; position:relative; z-index:1; }

        /* ===== 標題 ===== */
        .hero {
            text-align:center; margin-bottom:40px; padding:32px 24px 26px;
            background: linear-gradient(135deg, rgba(0,229,255,.08) 0%, rgba(29,233,182,.04) 30%, rgba(179,136,255,.08) 70%, rgba(0,229,255,.04) 100%);
            border:1px solid rgba(0,229,255,.2);
            border-radius:18px;
            position:relative; overflow:hidden;
            box-shadow: 0 0 40px rgba(0,229,255,.08), inset 0 0 60px rgba(0,229,255,.03);
        }
        .hero::before {
            content:''; position:absolute; top:0; left:0; right:0; height:2px;
            background: linear-gradient(90deg, transparent 10%, var(--cyan), var(--teal), var(--purple), var(--teal), var(--cyan), transparent 90%);
            background-size:200% auto;
            animation: neonBorder 3s linear infinite;
        }
        .hero::after {
            content:''; position:absolute; bottom:0; left:0; right:0; height:2px;
            background: linear-gradient(90deg, transparent 10%, var(--teal), var(--cyan), var(--purple), var(--cyan), var(--teal), transparent 90%);
            background-size:200% auto;
            animation: neonBorder 3s linear infinite reverse;
        }
        @keyframes neonBorder { 0%{background-position:200% center} 100%{background-position:-200% center} }
        .hero h1 {
            font-size:2.6em; letter-spacing:6px; margin-bottom:4px;
            background: linear-gradient(90deg, var(--cyan), var(--teal), var(--purple), var(--cyan), #c8b878, var(--cyan), var(--teal), var(--purple), var(--cyan));
            background-size:500% auto;
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
            animation: shimmer 12s linear infinite;
            filter: drop-shadow(0 0 30px rgba(0,229,255,.4)) drop-shadow(0 0 60px rgba(0,229,255,.15));
            position:relative;
        }
        .hero .sub { color:var(--text-dim); margin-top:8px; font-size:.9em; letter-spacing:3px; }
        @keyframes shimmer { 0%{background-position:0% center} 100%{background-position:500% center} }

        /* 裝飾角落 — 加長 + 動畫 */
        .corner-deco { position:absolute; width:30px; height:30px; transition: all .3s; }
        .corner-deco.tl { top:6px; left:6px; border-top:2px solid var(--cyan); border-left:2px solid var(--cyan); box-shadow:-2px -2px 8px rgba(0,229,255,.3); }
        .corner-deco.tr { top:6px; right:6px; border-top:2px solid var(--cyan); border-right:2px solid var(--cyan); box-shadow:2px -2px 8px rgba(0,229,255,.3); }
        .corner-deco.bl { bottom:6px; left:6px; border-bottom:2px solid var(--teal); border-left:2px solid var(--teal); box-shadow:-2px 2px 8px rgba(29,233,182,.3); }
        .corner-deco.br { bottom:6px; right:6px; border-bottom:2px solid var(--teal); border-right:2px solid var(--teal); box-shadow:2px 2px 8px rgba(29,233,182,.3); }
        .hero:hover .corner-deco { width:40px; height:40px; }

        /* ===== 分頁 Tab ===== */
        .tab-bar {
            display:flex; gap:0; margin-bottom:30px; border-radius:12px; overflow:hidden;
            border:1px solid rgba(0,229,255,.15); background:rgba(0,229,255,.02);
            box-shadow:0 0 20px rgba(0,229,255,.05);
        }
        .tab-btn {
            flex:1; padding:14px 20px; text-align:center; cursor:pointer;
            font-size:1.05em; font-weight:700; letter-spacing:2px;
            color:var(--text-dim); background:transparent; border:none;
            transition:all .3s; font-family:inherit; position:relative;
        }
        .tab-btn:hover { color:var(--text); background:rgba(0,229,255,.05); text-shadow:0 0 10px rgba(0,229,255,.3); }
        .tab-btn.active { color:var(--cyan); background:rgba(0,229,255,.1); text-shadow:0 0 15px rgba(0,229,255,.5); }
        .tab-btn.active::after {
            content:''; position:absolute; bottom:0; left:10%; right:10%; height:3px;
            background:linear-gradient(90deg, transparent, var(--cyan), var(--teal), var(--cyan), transparent);
            border-radius:3px 3px 0 0;
            box-shadow:0 0 10px rgba(0,229,255,.5);
        }
        .tab-page { display:none; }
        .tab-page.show { display:block; }

        /* ===== 總覽卡片 ===== */
        .stats-grid {
            display:grid; grid-template-columns:repeat(auto-fit,minmax(155px,1fr));
            gap:14px; margin-bottom:30px;
        }
        .stat-box {
            background: rgba(0,229,255,.03); border:1px solid rgba(0,229,255,.1);
            border-radius:14px; padding:18px 14px; text-align:center;
            transition: all .3s; position:relative; overflow:visible;
            display:flex; flex-direction:column; align-items:center; justify-content:center;
        }
        .stat-box::before {
            content:''; position:absolute; top:0; left:0; right:0; height:1px;
            background: linear-gradient(90deg, transparent, var(--cyan), transparent);
            opacity:0; transition: opacity .3s;
        }
        .stat-box:hover {
            transform:translateY(-4px);
            border-color:rgba(0,229,255,.25);
            box-shadow:0 8px 30px rgba(0,229,255,.1), 0 0 15px rgba(0,229,255,.05);
        }
        .stat-box:hover::before { opacity:1; }
        .stat-box .label { font-size:.75em; color:var(--text-dim); margin-bottom:6px; letter-spacing:1px; text-transform:uppercase; }
        .stat-box .val { font-size:1.5em; font-weight:800; }
        .stat-box .note { font-size:.7em; color:var(--text-dim); margin-top:4px; white-space:nowrap; }

        /* ===== 區塊共用 ===== */
        .section { margin-bottom:40px; }
        .section-title {
            font-size:1.25em; font-weight:700; color:var(--cyan);
            margin-bottom:18px; margin-top:12px; padding:10px 16px;
            border-left:3px solid var(--cyan);
            background: linear-gradient(90deg, rgba(0,229,255,.08), rgba(0,229,255,.02), transparent);
            backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
            border-radius:0 8px 8px 0;
            cursor:pointer; user-select:none;
            letter-spacing:2px;
            display:flex; align-items:center;
            position:sticky; top:0; z-index:20;
            text-shadow:0 0 20px rgba(0,229,255,.3);
            box-shadow:0 2px 15px rgba(0,229,255,.05);
        }
        .section-title .arrow { margin-left:auto; font-size:.7em; }
        .section-title .badge-count {
            margin-left:10px; font-size:.7em; padding:2px 10px;
            background:rgba(0,229,255,.15); border:1px solid rgba(0,229,255,.3);
            border-radius:12px; color:var(--cyan); font-weight:400;
            box-shadow:0 0 8px rgba(0,229,255,.15);
        }

        /* ===== 等級標籤 ===== */
        .grade-tag {
            display:inline-block; font-size:.72em; padding:2px 10px; border-radius:4px;
            font-weight:700; letter-spacing:1px; line-height:1.6;
        }
        .grade-s {
            background:rgba(255,215,64,.15); border:1px solid rgba(255,215,64,.4); color:var(--grade-s);
            text-shadow:0 0 8px rgba(255,215,64,.5), 0 0 20px rgba(255,215,64,.25);
            box-shadow:0 0 10px rgba(255,215,64,.15);
            animation: sGlow 2s ease-in-out infinite alternate;
        }
        @keyframes sGlow {
            0% { box-shadow:0 0 8px rgba(255,215,64,.1); }
            100% { box-shadow:0 0 15px rgba(255,215,64,.25); }
        }
        .grade-a {
            background:rgba(179,136,255,.12); border:1px solid rgba(179,136,255,.3); color:var(--grade-a);
            text-shadow:0 0 6px rgba(179,136,255,.3);
            box-shadow:0 0 6px rgba(179,136,255,.1);
        }
        .grade-b { background:rgba(68,138,255,.12); border:1px solid rgba(68,138,255,.25); color:var(--grade-b); }

        /* ===== 類型標籤 ===== */
        .type-tag {
            display:inline-block; font-size:.7em; padding:2px 8px; border-radius:4px;
            background:rgba(0,229,255,.06); border:1px solid rgba(0,229,255,.1); color:var(--text-dim);
            letter-spacing:1px; transition:all .2s;
        }
        .type-tag.char { background:rgba(29,233,182,.08); border-color:rgba(29,233,182,.2); color:var(--teal); }
        .type-tag.equip { background:rgba(68,138,255,.08); border-color:rgba(68,138,255,.2); color:var(--blue); }
        .type-tag.skin { background:rgba(255,171,64,.08); border-color:rgba(255,171,64,.2); color:var(--orange); }
        .type-tag.costume { background:rgba(179,136,255,.08); border-color:rgba(179,136,255,.2); color:var(--purple); }

        /* ===== 卡池卡片 ===== */
        .banner-card {
            background: linear-gradient(135deg, rgba(0,229,255,.03), rgba(179,136,255,.02));
            border:1px solid rgba(0,229,255,.1);
            border-radius:14px; padding:22px 24px; margin-bottom:16px;
            transition: all .3s; position:relative; overflow:hidden;
        }
        .banner-card::before {
            content:''; position:absolute; top:0; left:0; right:0; height:1px;
            background: linear-gradient(90deg, transparent, var(--cyan), var(--teal), transparent);
            opacity:0.6;
        }
        .banner-card::after {
            content:''; position:absolute; top:0; left:-100%; width:60%; height:100%;
            background: linear-gradient(90deg, transparent, rgba(0,229,255,.03), transparent);
            transition: left .6s;
        }
        .banner-card:hover { transform:translateY(-2px); border-color:rgba(0,229,255,.2); box-shadow:0 8px 30px rgba(0,229,255,.08); }
        .banner-card:hover::after { left:150%; }
        .banner-hd { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
        .banner-name {
            font-size:1.08em; font-weight:700; color:var(--cyan); letter-spacing:2px;
            text-shadow:0 0 15px rgba(0,229,255,.3);
        }
        .banner-featured { font-size:.85em; color:var(--teal); margin-left:8px; font-weight:400; letter-spacing:1px; text-shadow:0 0 10px rgba(29,233,182,.2); }
        .banner-date {
            font-size:.78em; color:var(--text-dim);
            background:rgba(0,229,255,.06); padding:4px 14px; border-radius:20px;
            border:1px solid rgba(0,229,255,.12); letter-spacing:1px;
        }
        .banner-items { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px; }
        .item-tag {
            font-size:.74em; padding:4px 12px; border-radius:6px;
            background:rgba(255,255,255,.02); border:1px solid rgba(255,255,255,.05);
            color:var(--text-dim); display:inline-flex; align-items:center; gap:4px;
            transition:all .2s;
        }
        .item-tag:hover { transform:translateY(-1px); }
        .item-tag.item-s { background:rgba(255,215,64,.08); border-color:rgba(255,215,64,.25); color:var(--grade-s); box-shadow:0 0 8px rgba(255,215,64,.1); }
        .item-tag.item-a { background:rgba(179,136,255,.08); border-color:rgba(179,136,255,.2); color:var(--grade-a); box-shadow:0 0 6px rgba(179,136,255,.08); }
        .item-tag.item-b { background:rgba(68,138,255,.06); border-color:rgba(68,138,255,.18); color:var(--grade-b); }

        /* 抽卡結果表格 */
        table.pull-tbl {
            width:100%; border-collapse:separate; border-spacing:0;
            border-radius:10px; overflow:hidden;
            border:1px solid rgba(0,229,255,.1); margin-bottom:12px;
            box-shadow:0 0 15px rgba(0,229,255,.03);
        }
        .pull-tbl th {
            background:linear-gradient(90deg, rgba(0,229,255,.08), rgba(29,233,182,.04)); padding:9px 10px; font-size:.78em;
            color:var(--cyan); letter-spacing:1px; text-align:center;
            border-bottom:1px solid rgba(0,229,255,.1);
            text-shadow:0 0 8px rgba(0,229,255,.3);
        }
        .pull-tbl td {
            padding:8px 10px; font-size:.84em; text-align:center;
            border-bottom:1px solid rgba(255,255,255,.02);
        }
        .pull-tbl tr:last-child td { border:none; }
        .pull-tbl tr:hover td { background:rgba(0,229,255,.05); }
        .pull-tbl .left { text-align:left; }
        .pull-tbl .pull-name { font-weight:600; }
        .pull-name.s-rank {
            color:var(--grade-s);
            text-shadow:0 0 10px rgba(255,215,64,.5), 0 0 24px rgba(255,215,64,.25);
            animation: goldPulse 3s ease-in-out infinite alternate;
        }
        @keyframes goldPulse {
            0% { text-shadow:0 0 10px rgba(255,215,64,.4), 0 0 20px rgba(255,215,64,.2); }
            100% { text-shadow:0 0 15px rgba(255,215,64,.6), 0 0 30px rgba(255,215,64,.3); }
        }
        .pull-name.a-rank { color:var(--grade-a); text-shadow:0 0 8px rgba(179,136,255,.3); }
        .pull-name.b-rank { color:var(--grade-b); }
        .pull-at { color:var(--teal); font-weight:700; text-shadow:0 0 6px rgba(29,233,182,.3); }
        .pull-batch { color:#a0aec0; font-size:.85em; }

        /* 花費統計 */
        .cost-bar {
            display:flex; gap:16px; flex-wrap:wrap; align-items:center;
            background:linear-gradient(90deg, rgba(0,229,255,.04), rgba(29,233,182,.02));
            border:1px solid rgba(0,229,255,.08);
            border-radius:10px; padding:10px 18px; font-size:.82em;
            box-shadow:inset 0 0 20px rgba(0,229,255,.02);
        }
        .cost-item { display:flex; align-items:center; gap:6px; }
        .cost-label { color:var(--text); letter-spacing:1px; }
        .cost-val { font-weight:700; }
        .cost-val.dice { color:var(--orange); text-shadow:0 0 6px rgba(255,171,64,.3); }
        .cost-val.stones { color:var(--cyan); text-shadow:0 0 6px rgba(0,229,255,.3); }

        /* ===== 統計圖表區 ===== */
        .chart-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:14px; }
        .chart-card {
            background: linear-gradient(135deg, rgba(0,229,255,.03), rgba(179,136,255,.02));
            border:1px solid rgba(0,229,255,.1);
            border-radius:14px; padding:20px; position:relative;
            box-shadow:0 0 15px rgba(0,229,255,.03);
        }
        .chart-card h3 { font-size:.85em; color:var(--text-dim); letter-spacing:2px; margin-bottom:14px; font-weight:400; }

        /* ===== 比例條 tooltip ===== */
        .bar-seg {
            display:flex; align-items:center; justify-content:center;
            font-size:.75em; font-weight:700; cursor:default;
            position:relative; transition:all .2s;
        }
        .bar-seg:first-child { border-radius:6px 0 0 6px; }
        .bar-seg:last-child { border-radius:0 6px 6px 0; }
        .bar-seg:only-child { border-radius:6px; }
        .bar-seg:hover { opacity:.85; transform:scaleY(1.15); }
        .bar-seg .tip {
            position:absolute; bottom:calc(100% + 8px); left:50%;
            transform:translateX(-50%) translateY(6px); white-space:pre; padding:8px 14px;
            background:rgba(5,8,16,.95); border:1px solid rgba(0,229,255,.3);
            border-radius:8px; font-size:11px; font-weight:400; line-height:1.6;
            color:var(--text); pointer-events:none; z-index:30;
            box-shadow:0 4px 20px rgba(0,0,0,.5), 0 0 15px rgba(0,229,255,.1);
            opacity:0; transition:opacity .2s, transform .2s;
        }
        .bar-seg .tip::after {
            content:''; position:absolute; top:100%; left:50%; transform:translateX(-50%);
            border:5px solid transparent; border-top-color:rgba(0,229,255,.3);
        }
        .bar-seg:hover .tip { opacity:1; transform:translateX(-50%) translateY(0); }

        /* ===== 圖表 ===== */
        .chart-wrap {
            background:linear-gradient(135deg, rgba(0,229,255,.02), rgba(179,136,255,.01));
            border:1px solid rgba(0,229,255,.1);
            border-radius:14px; padding:20px; margin-bottom:18px;
            position:relative; width:100%; min-width:0; overflow:hidden;
            box-shadow:0 0 20px rgba(0,229,255,.03);
        }

        /* ===== 排行表格 ===== */
        .rank-tbl { width:100%; border-collapse:separate; border-spacing:0; border-radius:10px; overflow:hidden; border:1px solid rgba(0,229,255,.1); box-shadow:0 0 15px rgba(0,229,255,.03); }
        .rank-tbl th { background:linear-gradient(90deg, rgba(0,229,255,.08), rgba(29,233,182,.04)); padding:10px 12px; font-size:.8em; color:var(--cyan); text-align:center; border-bottom:1px solid rgba(0,229,255,.1); text-shadow:0 0 8px rgba(0,229,255,.3); }
        .rank-tbl td { padding:9px 12px; font-size:.85em; text-align:center; border-bottom:1px solid rgba(255,255,255,.02); }
        .rank-tbl tr:hover td { background:rgba(0,229,255,.05); }
        .rank-tbl .left { text-align:left; }
        .c-green { color:var(--green); font-weight:700; text-shadow:0 0 8px rgba(105,240,174,.3); }
        .c-red { color:var(--red); font-weight:700; text-shadow:0 0 8px rgba(255,82,82,.3); }
        .c-dim { color:var(--text-dim); }
        .mob-br { display:none; }
        .mob-br-wrap { white-space:nowrap; }

        /* ===== 抽卡時間軸 ===== */
        .timeline { position:relative; padding-left:30px; }
        .timeline::before {
            content:''; position:absolute; left:10px; top:0; bottom:0; width:2px;
            background: linear-gradient(to bottom, var(--cyan), var(--teal), var(--purple), transparent);
            box-shadow:0 0 8px rgba(0,229,255,.3);
        }
        .timeline-item {
            position:relative; margin-bottom:10px; padding:10px 16px;
            background:linear-gradient(90deg, rgba(0,229,255,.03), transparent);
            border:1px solid rgba(0,229,255,.06);
            border-radius:10px; font-size:.85em;
            transition:all .2s;
        }
        .timeline-item:hover { border-color:rgba(0,229,255,.15); background:linear-gradient(90deg, rgba(0,229,255,.06), transparent); }
        .timeline-item::before {
            content:''; position:absolute; left:-24px; top:14px;
            width:8px; height:8px; border-radius:50%;
            border:2px solid var(--cyan); background:var(--bg-dark);
            transition:all .2s;
        }
        .timeline-item:hover::before { box-shadow:0 0 8px rgba(0,229,255,.5); }
        .timeline-item.ltd-item::before {
            border-color:var(--grade-a); background:var(--grade-a);
            box-shadow:0 0 6px rgba(179,136,255,.4);
        }
        .timeline-item.ltd-item.s-item::before {
            border-color:var(--grade-s); background:var(--grade-s);

<div class="container" id="app"></div>
<button class="back-top" id="btnTop">↑</button>
<div class="toast" id="toast"></div>

<script>document.write('<script src="NTE_data.js?' + Date.now() + '"><\/script>');</script>
<script>
// ============================
// 工具函式
// ============================
function getTypeClass(type) {
    if (type === '角色') return 'char';
    if (type === '滑翔翼') return 'equip';
    if (type === '塗裝') return 'skin';
    if (type === '時裝') return 'costume';
    return '';
}
function getTypeIcon(type) {
    if (type === '角色') return '👤';
    if (type === '滑翔翼') return '🪂';
    if (type === '塗裝') return '🎨';
    if (type === '時裝') return '👗';
    return '📦';
}
function gradeClass(g) {
    return g === 'S' ? 'grade-s' : g === 'A' ? 'grade-a' : 'grade-b';
}
function gradeRankClass(g) {
    return g === 'S' ? 's-rank' : g === 'A' ? 'a-rank' : 'b-rank';
}
// 解析算式字串，例：'10+6' → 16
function sumFormula(str) {
    if (!str) return 0;
    return String(str).split('+').reduce(function(s, v){ return s + (parseInt(v) || 0); }, 0);
}

// ============================
// 計算引擎
// ============================
function compute() {
    var totalPulls = 0, totalDice = 0, totalStones = 0;
    var totalS = 0, totalA = 0, totalB = 0;
    var totalChars = 0, totalEquips = 0, sChars = 0, aChars = 0, sEquips = 0, aEquips = 0;
    var limitedChars = 0, limitedEquips = 0, stdChars = 0;
    var bannerCount = banners.length;
    var allPulls = [];

    banners.forEach(function(b) {
        var bPulls = sumFormula(b.cost.pulls);
        totalPulls += bPulls;
        totalDice += sumFormula(b.cost.dice);
        totalStones += sumFormula(b.cost.stones);
        // 建立該卡池限定名單
        var itemNames = {};
        b.items.forEach(function(item) { itemNames[item.n] = item.type; });
        b.pulls.forEach(function(p) {
            if (p.grade === 'S') totalS++;
            else if (p.grade === 'A') totalA++;
            else totalB++;
            var isLimited = !!itemNames[p.n];
            if (p.type === '角色') {
                totalChars++;
                if (p.grade === 'S') sChars++;
                else if (p.grade === 'A') aChars++;
                if (isLimited) limitedChars++;
                else stdChars++;
            } else {
                totalEquips++;
                if (p.grade === 'S') sEquips++;
                else if (p.grade === 'A') aEquips++;
                if (isLimited) limitedEquips++;
            }
            allPulls.push({ n:p.n, grade:p.grade, type:p.type, at:p.at, totalPulls:bPulls, banner:b.name, featured:b.featured, date:b.date, limited:isLimited });
        });
    });
    var avgPullsPerItem = allPulls.length ? Math.round(totalPulls / allPulls.length * 10) / 10 : 0;
    // 從第一期卡池開始日到今天的月數
    var firstParts = banners[0].date.split('-')[0].split('/');
    var firstD = new Date(parseInt(firstParts[0]), parseInt(firstParts[1])-1, parseInt(firstParts[2]));
    var now = new Date();
    var totalMonths = Math.max(1, Math.round((now - firstD) / (1000*60*60*24*30)));
    var avgPullsPerMonth = Math.round(totalPulls / totalMonths);
    return { totalPulls:totalPulls, totalDice:totalDice, totalStones:totalStones, totalMonths:totalMonths, avgPullsPerMonth:avgPullsPerMonth,
        totalS:totalS, totalA:totalA, totalB:totalB,
        totalChars:totalChars, totalEquips:totalEquips, sChars:sChars, aChars:aChars, sEquips:sEquips, aEquips:aEquips,
        limitedChars:limitedChars, limitedEquips:limitedEquips, stdChars:stdChars,
        bannerCount:bannerCount, allPulls:allPulls, avgPullsPerItem:avgPullsPerItem };
}

// ============================
// 分頁切換

function switchTab(tab, btn) {
    document.querySelectorAll('#app > .tab-bar .tab-btn').forEach(function(b){ b.className = 'tab-btn'; });
    btn.className = 'tab-btn active';
    document.querySelectorAll('#app > .tab-page').forEach(function(p){ p.classList.remove('show'); });
    var target;
    if (tab === 'admin') target = document.getElementById('tabAdmin');
    else if (tab === 'special') target = document.getElementById('tabSpecial');
    else target = document.getElementById('tabGacha');
    if (target) target.classList.add('show');
    if (tab === 'admin' && !window._adminInitialized) initAdminPanel();
    if (tab === 'special' && !window._specialInitialized) initSpecialTab();
    window.scrollTo({top:0, behavior:'smooth'});
}

function toggleSec(el) {
    var body = el.nextElementSibling;
    var arrow = el.querySelector('.arrow');
    if (body.style.display === 'none') { body.style.display = ''; arrow.textContent = '▼'; }
    else { body.style.display = 'none'; arrow.textContent = '▶'; }
}

function drawCharts() {
    if (banners.length < 2) return;

    var labels = banners.map(function(b) {
        var n = b.name;
        return n.length > 6 ? n.slice(0,6) + '…' : n;
    });

    // 每池資料：分限定/常駐
    var pullsData = [];
    var ltdCharsData = [], ltdEquipsData = [], stdCharsData = [];
    var diceData = [], stonesData = [];
    banners.forEach(function(b) {
        pullsData.push(sumFormula(b.cost.pulls));
        var bItemNames = {};
        b.items.forEach(function(item) { bItemNames[item.n] = true; });
        var lc = 0, le = 0, sc = 0;
        b.pulls.forEach(function(p) {
            var isLtd = !!bItemNames[p.n];
            if (p.type === '角色') { if (isLtd) lc++; else sc++; }
            else { if (isLtd) le++; }
        });
        ltdCharsData.push(lc);
        ltdEquipsData.push(le);
        stdCharsData.push(sc);
        diceData.push(sumFormula(b.cost.dice));
        stonesData.push(sumFormula(b.cost.stones));
    });

    // 圖1：每池獲得分布（堆疊）+ 抽數折線
    var c1 = document.getElementById('chartPulls');
    if (c1) {
        new Chart(c1, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [
                    { label:'限定角色', data:ltdCharsData, backgroundColor:'rgba(255,215,64,.4)', borderColor:'#ffd740', borderWidth:1, borderRadius:4, stack:'items', yAxisID:'y' },
                    { label:'限定裝扮', data:ltdEquipsData, backgroundColor:'rgba(0,229,255,.35)', borderColor:'#00e5ff', borderWidth:1, borderRadius:4, stack:'items', yAxisID:'y' },
                    { label:'常駐角色', data:stdCharsData, backgroundColor:'rgba(255,255,255,.12)', borderColor:'rgba(255,255,255,.3)', borderWidth:1, borderRadius:4, stack:'items', yAxisID:'y' },
                    { label:'抽數', data:pullsData, type:'line', borderColor:'#b388ff', backgroundColor:'#b388ff', pointRadius:4, pointBackgroundColor:'#b388ff', tension:.3, yAxisID:'y1' }
                ]
            },
            options: {
                responsive:true, maintainAspectRatio:false,
                plugins: { title:{ display:true, text:'每池獲得分布 & 抽數', color:'#80deea', font:{size:14} }, legend:{ labels:{color:'#8b8fa3'} } },
                scales: {
                    x:{ stacked:true, ticks:{color:'#666',maxRotation:45,font:{size:10}} },
                    y:{ stacked:true, title:{display:true,text:'獲得數',color:'#00e5ff'}, ticks:{color:'#00e5ff',stepSize:1}, grid:{color:'rgba(255,255,255,.04)'} },
                    y1:{ position:'right', title:{display:true,text:'抽數',color:'#b388ff'}, ticks:{color:'#b388ff'}, grid:{drawOnChartArea:false} }
                }
            }
        });
    }

    // 圖2：骰子和環石分開Y軸
    var cumDice = 0;
    var cumDiceData = diceData.map(function(v){ cumDice += v; return cumDice; });
    var cumStones = 0;
    var cumStonesData = stonesData.map(function(v){ cumStones += v; return cumStones; });

function renderBlindboxEvent(evt, innerCollapsed) {
    var h = '';
    var drawn = evt.pulls.length;
    var total = evt.totalBoxes;
    var remaining = total - drawn;
    var pct = Math.round(drawn / total * 100);

    // 建立已抽出對照（支援重複品項，依序配對）
    var drawnMap = []; // 對應 items 陣列，每格存 order 或 null
    var pullsCopy = evt.pulls.map(function(p) { return {n:p.n, order:p.order, used:false}; });
    evt.items.forEach(function(item, idx) {
        var matched = null;
        for (var j = 0; j < pullsCopy.length; j++) {
            if (!pullsCopy[j].used && pullsCopy[j].n === item.n) {
                matched = pullsCopy[j].order;
                pullsCopy[j].used = true;
                break;
            }
        }
        drawnMap.push(matched);
    });

    // 計算等級統計
    var sCount = 0, aCount = 0, bCount = 0;
    evt.pulls.forEach(function(p) {
        if (p.grade === 'S') sCount++;
        else if (p.grade === 'A') aCount++;
        else bCount++;
    });

    // 計算已花費（根據每次實際使用的貨幣）
    var spentStones = 0, spentFons = 0;
    for (var i = 0; i < drawn; i++) {
        var usedCurrency = evt.pulls[i].currency || 'stones';
        if (usedCurrency === 'stones') spentStones += evt.prices.stones[i];
        else spentFons += evt.prices.fons[i];
    }
    // 計算全部價格合計
    var totalStones = 0, totalFons = 0;
    for (var i = 0; i < evt.prices.stones.length; i++) {
        totalStones += evt.prices.stones[i];
        totalFons += evt.prices.fons[i];
    }

    h += '<div class="blindbox-event">';

    // 標題
    h += '<div class="event-header">';
    h += '<div class="event-name">盲盒【' + evt.name + '】</div>';
    h += '<span class="banner-date">' + evt.date + '</span>';
    h += '</div>';

    // 說明
    h += '<div class="event-desc">' + evt.description + '</div>';

    // 進度條
    h += '<div class="event-progress">';
    h += '<span style="color:var(--orange);font-weight:700">' + drawn + '/' + total + '</span>';
    h += '<div class="prog-bar"><div class="prog-fill" style="width:' + pct + '%"></div>';
    h += '<div class="prog-text">' + pct + '%</div></div>';
    h += '<span style="color:var(--text-dim);font-size:.85em">剩餘 ' + remaining + ' 個</span>';
    h += '</div>';

    // 統計卡片
    h += '<div class="event-stats-grid">';
    h += '<div class="event-stat-box"><div class="label">已開啟</div><div class="val" style="color:var(--orange)">' + drawn + '</div></div>';
    h += '<div class="event-stat-box"><div class="label">S 級</div><div class="val" style="color:var(--grade-s)">' + sCount + '</div></div>';
    h += '<div class="event-stat-box"><div class="label">A 級</div><div class="val" style="color:var(--grade-a)">' + aCount + '</div></div>';
    h += '<div class="event-stat-box"><div class="label">B 級</div><div class="val" style="color:var(--grade-b)">' + bCount + '</div></div>';
    h += '<div class="event-stat-box"><div class="label">已花' + evt.prices.stonesName + '</div><div class="val" style="color:var(--cyan)">' + spentStones.toLocaleString() + '</div></div>';
    h += '<div class="event-stat-box"><div class="label">已花' + evt.prices.fonsName + '</div><div class="val" style="color:var(--teal)">' + spentFons.toLocaleString() + '</div></div>';
    h += '</div>';

    // --- 盲盒全覽 ---
    var secArrow = innerCollapsed ? '▶' : '▼';
    var secDisplay = innerCollapsed ? ' style="display:none"' : '';
    h += '<div class="section"><div class="section-title" onclick="toggleSec(this)">盲盒內容一覽<span class="badge-count">' + total + ' 個</span><span class="arrow">' + secArrow + '</span></div>';
    h += '<div class="sec-body"' + secDisplay + '>';
    h += '<div class="blindbox-grid">';
    evt.items.forEach(function(item, idx) {
        var order = drawnMap[idx];
        var isOpened = (order !== null);
        var cellClass = isOpened ? 'opened' : 'unopened';
        var rankClass = item.grade === 'S' ? 's-rank' : item.grade === 'A' ? 'a-rank' : 'b-rank';

        h += '<div class="blindbox-cell ' + cellClass + '">';
        h += '<div class="box-num"><span class="grade-tag grade-' + item.grade.toLowerCase() + '">' + item.grade + '</span></div>';
        if (isOpened) {
            h += '<div class="box-name ' + rankClass + '">' + item.n + '</div>';
            h += '<div class="box-order">第 ' + order + ' 抽開出</div>';
        } else {
            h += '<div class="box-name ' + rankClass + '">' + item.n + '</div>';
            h += '<div class="box-unknown">?</div>';
        }
        h += '</div>';
    });
    h += '</div>';
    h += '</div></div>';

    // --- 抽取紀錄 ---
    h += '<div class="section"><div class="section-title" onclick="toggleSec(this)">抽取紀錄<span class="badge-count">' + drawn + ' 次</span><span class="arrow">' + secArrow + '</span></div>';
    h += '<div class="sec-body"' + secDisplay + '>';
    h += '<div class="pull-history-list">';
    evt.pulls.forEach(function(p, idx) {
        var rankClass = p.grade === 'S' ? 's-rank' : p.grade === 'A' ? 'a-rank' : 'b-rank';
        var usedCurrency = p.currency || 'stones';
        var costDisplay = '';
        if (usedCurrency === 'stones') {
            costDisplay = '💎 ' + evt.prices.stones[idx].toLocaleString() + ' ' + evt.prices.stonesName;
        } else {
            costDisplay = evt.prices.fons[idx].toLocaleString() + ' ' + evt.prices.fonsName;
        }

        h += '<div class="pull-history-item">';
        h += '<div class="pull-order-num">' + p.order + '</div>';
        h += '<span class="grade-tag grade-' + p.grade.toLowerCase() + '">' + p.grade + '</span>';
        h += '<span class="pull-name ' + rankClass + '">' + p.n + '</span>';
        h += '<span class="pull-cost-info">' + costDisplay + '</span>';
        h += '</div>';
    });
    h += '</div>';
    h += '</div></div>';

    // --- 價格表 ---
    h += '<div class="section"><div class="section-title" onclick="toggleSec(this)">盲盒價格表<span class="arrow">' + secArrow + '</span></div>';
    h += '<div class="sec-body"' + secDisplay + '>';
    h += '<table class="price-table"><thead><tr>';
    h += '<th>第幾次</th><th>' + evt.prices.stonesName + '</th><th>' + evt.prices.fonsName + '</th><th>狀態</th>';
    h += '</tr></thead><tbody>';
    var cumStones = 0, cumC2 = 0;
    for (var i = 0; i < total; i++) {
        cumStones += evt.prices.stones[i];
        cumC2 += evt.prices.fons[i];
        var rowClass = '';
        var status = '';
        if (i < drawn) {
            rowClass = ' class="used-row"';
            status = '<span style="color:var(--teal)">✓ 已抽</span>';
        } else if (i === drawn) {
            rowClass = ' class="current-row"';
            status = '<span style="color:var(--orange)">▶ 下一抽</span>';
        } else {
            status = '<span style="color:var(--text-dim)">—</span>';
        }
        h += '<tr' + rowClass + '>';
        h += '<td>' + (i + 1) + '</td>';
        h += '<td>' + evt.prices.stones[i].toLocaleString() + '</td>';
        h += '<td>' + evt.prices.fons[i].toLocaleString() + '</td>';
        h += '<td>' + status + '</td>';
        h += '</tr>';
    }
    h += '<tr style="font-weight:700;border-top:2px solid rgba(255,171,64,.2)">';
    h += '<td style="color:var(--orange)">合計</td>';
    h += '<td style="color:var(--cyan)">' + totalStones.toLocaleString() + ' ' + evt.prices.stonesName + '</td>';
    h += '<td style="color:var(--teal)">' + totalFons.toLocaleString() + ' ' + evt.prices.fonsName + '</td>';
    h += '<td></td>';
    h += '</tr>';
    h += '</tbody></table>';
    h += '</div></div>';

    h += '</div>'; // blindbox-event

    return h;
}

function showToast(msg, isError) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast' + (isError ? ' error' : '');
    t.style.display = 'block';
    requestAnimationFrame(function(){ t.classList.add('show'); });
    setTimeout(function(){
        t.classList.remove('show');
        setTimeout(function(){ t.style.display = 'none'; }, 300);
    }, 3000);
}

function focusField(id, msg) {
    var el = document.getElementById(id);
    focusEl(el, msg);
}
function focusEl(el, msg) {
    showToast(msg, true);
    if (!el) return;
    el.scrollIntoView({behavior:'smooth', block:'center'});
    el.focus();
    el.style.transition = 'box-shadow .2s';
    el.style.boxShadow = '0 0 0 3px rgba(255,82,82,.5)';
    setTimeout(function(){ el.style.boxShadow = ''; }, 3000);
}

function checkHasValue(el) {
    if (el.type === 'checkbox') return;
    if (el.value && el.value.trim() !== '' && el.value !== '0') el.classList.add('has-value');
    else el.classList.remove('has-value');
}
document.addEventListener('input', function(e) {
    if (e.target.matches('.form-group input, .form-group select, .form-group textarea')) checkHasValue(e.target);
});
document.addEventListener('change', function(e) {
    if (e.target.matches('.form-group input, .form-group select, .form-group textarea')) checkHasValue(e.target);
});

// ============================
document.addEventListener('click', function(e) {
    if (e.target.matches('#tabAdmin input[type="date"]')) {
        if (!e.target.value) {
            var now = new Date();
            var pad = function(n){ return n < 10 ? '0'+n : n; };
            e.target.value = now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate());
            checkHasValue(e.target);
        }
        e.target.showPicker();
    }
});
document.addEventListener('keydown', function(e) {
    if (e.target.matches('#tabAdmin input[type="date"]')) e.preventDefault();
});
document.addEventListener('change', function(e) {
    var from = document.getElementById('fDateFrom');
    var to = document.getElementById('fDateTo');
    if (!from || !to) return;
    if (e.target === from && to.value && from.value > to.value) { to.value = from.value; checkHasValue(to); }
    if (e.target === to && from.value && to.value < from.value) { from.value = to.value; checkHasValue(from); }
});

    var div = document.createElement('div');

    div.innerHTML = '<select class="itemGrade" onchange="refreshQuickBtns()"><option value="" disabled selected hidden>等級</option>' + gradeOptions + '</select>'

function removeItem(btn) {
    var entries = document.querySelectorAll('#itemsList .card-entry');
    if (entries.length <= 1) { showToast('至少要保留一項', true); return; }
    btn.parentElement.remove();
    updateItemDeleteBtns();
    refreshQuickBtns();
}

function refreshQuickBtns() {
    var btnsHtml = getItemQuickBtns();
    document.querySelectorAll('#pullsList .pull-entry').forEach(function(entry) {
        var existing = entry.querySelector('.quick-select-row');
        if (existing) existing.remove();
        if (btnsHtml) {
            var temp = document.createElement('div');
            temp.innerHTML = btnsHtml;
            var row = temp.firstChild;
            row.classList.add('quick-select-row');
            var firstFormRow = entry.querySelectorAll('.form-row')[0];
            if (firstFormRow && firstFormRow.nextSibling) {
                entry.insertBefore(row, firstFormRow.nextSibling);
            }
        }
    });
}

function updateItemDeleteBtns() {
    var entries = document.querySelectorAll('#itemsList .card-entry');
    entries.forEach(function(entry) {
        entry.querySelector('.card-del').style.display = entries.length <= 1 ? 'none' : '';
    });
}

    var el = document.getElementById('dataList');
    if (!el) return;
    document.getElementById('bannerCount').textContent = banners.length;
    var h = '', count = 0;
    for (var i = banners.length - 1; i >= 0; i--) {
        count++;
        var hidden = count > dataListShown ? ' style="display:none"' : '';
        var b = banners[i];
        var pullCount = b.pulls ? b.pulls.length : 0;
        var bDice = b.cost ? sumFormula(b.cost.dice) : 0;
        var bStones = b.cost ? sumFormula(b.cost.stones) : 0;
        h += '<div class="data-item" data-idx="' + count + '"' + hidden + '>'
            + '<div><span class="name">' + (i+1) + '. 【' + b.name + '】</span>'
            + '<span class="meta" style="margin-left:8px">' + b.featured + '</span></div>'
            + '<div class="meta">' + b.date + ' | ' + pullCount + ' 筆 | 🎲' + bDice + ' 💎' + bStones.toLocaleString() + '</div></div>';
    }
    if (banners.length > 5) {
        h += '<div id="showMoreWrap" style="text-align:center;margin-top:12px;display:flex;gap:10px;justify-content:center">';
        if (banners.length > dataListShown) h += '<button class="btn btn-accent" onclick="showMoreData()">顯示更多（還有 ' + (banners.length - dataListShown) + ' 筆）</button>';
        if (dataListShown > 5) h += '<button class="btn" onclick="collapseData()">收合</button>';
        h += '</div>';
    }
    el.innerHTML = h;
}

function showMoreData() {
    dataListShown = Math.min(dataListShown + 5, banners.length);
    document.querySelectorAll('#dataList .data-item').forEach(function(item) {
        item.style.display = parseInt(item.dataset.idx) <= dataListShown ? '' : 'none';
    });
    updateDataButtons();
}
function collapseData() {
    dataListShown = 5;
    document.querySelectorAll('#dataList .data-item').forEach(function(item) {
        item.style.display = parseInt(item.dataset.idx) <= 5 ? '' : 'none';
    });
    updateDataButtons();
}
function updateDataButtons() {
    var wrap = document.getElementById('showMoreWrap');
    if (!wrap) return;
    var left = banners.length - dataListShown;
    var h = '';
    if (left > 0) h += '<button class="btn btn-accent" onclick="showMoreData()">顯示更多（還有 ' + left + ' 筆）</button>';
    if (dataListShown > 5) h += '<button class="btn" onclick="collapseData()">收合</button>';
    wrap.innerHTML = h;
}

// ============================
// 出卡紀錄管理
// ============================
var ntePullCount = 0;

function getItemQuickBtns() {
    var items = [];
    document.querySelectorAll('#itemsList .card-entry').forEach(function(entry) {
        var grade = entry.querySelector('.itemGrade').value;
        var type = entry.querySelector('.itemType').value;
        var n = entry.querySelector('.itemName').value.trim();
        if (grade && type && n) items.push({grade:grade, type:type, n:n});
    });
    if (items.length === 0) return '';
    var h = '<div class="form-row quick-select-row" style="margin-top:4px;gap:6px;flex-wrap:wrap"><span style="font-size:.78em;color:var(--text-dim)">快速選擇：</span>';
    items.forEach(function(item) {
        var cls = item.grade === 'S' ? 'item-s' : item.grade === 'A' ? 'item-a' : 'item-b';
        h += '<span class="item-tag ' + cls + '" style="cursor:pointer" onclick="fillPullFromItem(this,\'' + item.grade + '\',\'' + item.type + '\',\'' + item.n + '\')"><b>' + item.grade + '</b> ' + getTypeIcon(item.type) + ' ' + item.n + '</span>';
    });
    h += '</div>';
    return h;
}

function fillPullFromItem(el, grade, type, name) {
    var entry = el.closest('.pull-entry');
    var gradeSel = entry.querySelector('.pGrade');
    var typeSel = entry.querySelector('.pType');
    var nameInput = entry.querySelector('.pName');
    gradeSel.value = grade; checkHasValue(gradeSel);
    typeSel.value = type; checkHasValue(typeSel);
    nameInput.value = name; checkHasValue(nameInput);
}

function addPull() {
    var prevAt = 0;
    var lastEntry = document.querySelector('#pullsList .pull-entry:last-child');
    if (lastEntry) {
        prevAt = parseInt(lastEntry.querySelector('.pAt').value) || 0;
    }
    ntePullCount++;
    var displayNum = document.querySelectorAll('#pullsList .pull-entry').length + 1;
    var div = document.createElement('div');
    div.className = 'pull-entry';
    div.id = 'pull_' + ntePullCount;
    div.innerHTML = '<span class="pull-num">#' + displayNum + '</span>'
        + '<div class="form-row"><div class="form-group"><label>等級</label>'
        + '<select class="pGrade" onchange="checkHasValue(this)"><option value="" disabled selected hidden>— 選擇 —</option>' + gradeOptions + '</select></div>'
        + '<div class="form-group"><label>類型</label>'
        + '<select class="pType" onchange="checkHasValue(this)"><option value="" disabled selected hidden>— 選擇 —</option>' + typeOptions + '</select></div>'
        + '<div class="form-group" style="flex:2"><label>名稱</label><input type="text" class="pName" placeholder="例：安魂曲"></div></div>'
        + getItemQuickBtns()
        + '<div class="form-row" style="gap:10px">'
        + '<div class="pull-cell"><span class="pull-cell-tag">第幾抽出</span><div class="pull-qty-row"><button type="button" class="qty-btn minus" onclick="pullQtyChange(this,\'pAt\',-1)">−</button><input type="number" class="pAt" value="' + prevAt + '" min="0" oninput="sanitizeNum(this)"' + (prevAt > 0 ? ' class="has-value"' : '') + '><button type="button" class="qty-btn plus" onclick="pullQtyChange(this,\'pAt\',1)">+</button></div><span class="pull-cell-unit">每次 ±1</span></div>'
        + '</div>'
        + '<div style="text-align:right;margin-top:6px"><button class="btn btn-danger" onclick="removePull(' + ntePullCount + ')" style="font-size:.75em;padding:4px 12px">刪除此筆</button></div>';
    document.getElementById('pullsList').appendChild(div);
    updatePullDeleteBtns();
}

function removePull(id) {
    var el = document.getElementById('pull_' + id);
    if (el) el.remove();
    var remaining = document.querySelectorAll('#pullsList .pull-entry');
    remaining.forEach(function(entry, i) { entry.querySelector('.pull-num').textContent = '#' + (i + 1); });
    updatePullDeleteBtns();
}

function updatePullDeleteBtns() {
    var entries = document.querySelectorAll('#pullsList .pull-entry');
    entries.forEach(function(entry) {
        entry.querySelector('.btn-danger').style.display = entries.length <= 1 ? 'none' : '';
    });
}

// ============================
// 加減按鈕
// ============================
function sanitizeNum(el) {
    el.value = el.value.replace(/[^0-9]/g, '');
    var val = parseInt(el.value) || 0;
    if (val < 0) val = 0;
    el.value = val;
    el.classList.toggle('has-value', val > 0);
}

function pullQtyChange(btn, cls, delta) {
    var row = btn.closest('.pull-qty-row');
    var input = row.querySelector('.' + cls);
    var val = (parseInt(input.value) || 0) + delta;
    if (val < 0) val = 0;
    input.value = val;
    input.classList.toggle('has-value', val > 0);
}

// ============================
// 花費輪次管理
// ============================
var costRoundCount = 0;

function addCostRound() {
    costRoundCount++;
    var roundNum = document.querySelectorAll('#costRounds .cost-round').length + 1;
    var div = document.createElement('div');
    div.className = 'cost-round';
    div.id = 'cr_' + costRoundCount;
    div.style.cssText = 'background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);border-radius:10px;padding:12px;margin-bottom:8px;position:relative';
    div.innerHTML = '<span style="font-size:.8em;color:var(--cyan);font-weight:600">第 ' + roundNum + ' 輪</span>'
        + '<div class="form-row" style="margin-top:8px;gap:10px">'
        + '<div class="pull-cell"><span class="pull-cell-tag">抽數</span><div class="pull-qty-row"><button type="button" class="qty-btn minus" onclick="crChange(this,\'crPulls\',-10)">−</button><input type="number" class="crPulls has-value" value="10" min="0" oninput="sanitizeNum(this);updateCostSummary()"><button type="button" class="qty-btn plus" onclick="crChange(this,\'crPulls\',10)">+</button></div><span class="pull-cell-unit">每次 ±10</span></div>'
        + '<div class="pull-cell"><span class="pull-cell-tag">骰子 🎲</span><div class="pull-qty-row"><button type="button" class="qty-btn minus" onclick="crChange(this,\'crDice\',-1)">−</button><input type="number" class="crDice has-value" value="10" min="0" oninput="sanitizeNum(this);updateCostSummary()"><button type="button" class="qty-btn plus" onclick="crChange(this,\'crDice\',1)">+</button></div><span class="pull-cell-unit">每次 ±1</span></div>'
        + '<div class="pull-cell"><span class="pull-cell-tag">環石 💎</span><div class="pull-qty-row"><button type="button" class="qty-btn minus" onclick="crChange(this,\'crStones\',-160)">−</button><input type="number" class="crStones" value="0" min="0" oninput="sanitizeNum(this);updateCostSummary()"><button type="button" class="qty-btn plus" onclick="crChange(this,\'crStones\',160)">+</button></div><span class="pull-cell-unit">每次 ±160</span></div>'
        + '</div>'
        + '<div style="text-align:right;margin-top:4px"><button class="btn btn-danger" onclick="removeCostRound(' + costRoundCount + ')" style="font-size:.7em;padding:3px 10px">刪除</button></div>';
    document.getElementById('costRounds').appendChild(div);
    updateCostRoundDeleteBtns();
    updateCostSummary();
}

function removeCostRound(id) {
    var el = document.getElementById('cr_' + id);
    if (el) el.remove();
    var rounds = document.querySelectorAll('#costRounds .cost-round');
    rounds.forEach(function(r, i) {
        r.querySelector('span').textContent = '第 ' + (i + 1) + ' 輪';
    });
    updateCostRoundDeleteBtns();
    updateCostSummary();
}

function updateCostRoundDeleteBtns() {
    var rounds = document.querySelectorAll('#costRounds .cost-round');
    rounds.forEach(function(r) {
        var btn = r.querySelector('.btn-danger');
        btn.style.display = rounds.length <= 1 ? 'none' : '';
    });
}

function crChange(btn, cls, delta) {
    var row = btn.closest('.pull-qty-row');
    var input = row.querySelector('.' + cls);
    var val = (parseInt(input.value) || 0) + delta;
    if (val < 0) val = 0;
    input.value = val;
    input.classList.toggle('has-value', val > 0);
    updateCostSummary();
}

function getCostFormulas() {
    var pulls = [], dice = [], stones = [];
    document.querySelectorAll('#costRounds .cost-round').forEach(function(r) {
        pulls.push(parseInt(r.querySelector('.crPulls').value) || 0);
        dice.push(parseInt(r.querySelector('.crDice').value) || 0);
        stones.push(parseInt(r.querySelector('.crStones').value) || 0);
    });
    // 累計抽數
    var cumPulls = [];
    var sum = 0;
    pulls.forEach(function(v) { sum += v; cumPulls.push(sum); });
    return {
        pulls: cumPulls.join('+'),
        dice: dice.join('+'),
        stones: stones.join('+'),
        totalPulls: sum,
        totalDice: dice.reduce(function(s,v){return s+v;},0),
        totalStones: stones.reduce(function(s,v){return s+v;},0)
    };
}

function updateCostSummary() {
    var c = getCostFormulas();
    var el = document.getElementById('costSummary');
    if (el) {
        var showF = function(formula, total) { return formula.indexOf('+') > -1 ? formula + '=' + total : '' + total; };
        el.innerHTML = '抽數 <b style="color:var(--teal)">' + showF(c.pulls, c.totalPulls) + '</b>　骰子 <b style="color:var(--orange)">' + showF(c.dice, c.totalDice) + '</b>　環石 <b style="color:var(--cyan)">' + showF(c.stones, c.totalStones) + '</b>';
    }
}

// ============================
// 產生程式碼
// ============================
function fmtDate(isoStr) {
    if (!isoStr) return '';
    var dParts = isoStr.split('-');
    return dParts[0] + '/' + parseInt(dParts[1]) + '/' + parseInt(dParts[2]);
}
function shortDate(isoStr) {
    if (!isoStr) return '';
    var dParts = isoStr.split('-');
    return parseInt(dParts[1]) + '/' + parseInt(dParts[2]);
}

function buildBannerObj() {
    var name = document.getElementById('fName').value.trim();
    var featured = document.getElementById('fFeatured').value.trim();
    var dateFrom = document.getElementById('fDateFrom').value;
    var dateTo = document.getElementById('fDateTo').value;

    if (!name) { focusField('fName', '請填寫卡池名稱'); return null; }
    if (!featured) { focusField('fFeatured', '請填寫主打角色'); return null; }
    if (!dateFrom) { focusField('fDateFrom', '請填寫起始日期'); return null; }
    if (!dateTo) { focusField('fDateTo', '請填寫結束日期'); return null; }

    // 內容物
    var itemEntries = document.querySelectorAll('#itemsList .card-entry');
    var items = [];
    var hasItemError = false;
    itemEntries.forEach(function(entry) {
        if (hasItemError) return;
        var grade = entry.querySelector('.itemGrade').value;
        var type = entry.querySelector('.itemType').value;
        var n = entry.querySelector('.itemName').value.trim();
        if (grade && type && n) items.push({n:n, grade:grade, type:type});
        else if (grade || type || n) { focusEl(entry.querySelector('.itemName'), '內容物資料不完整'); hasItemError = true; }
    });
    if (hasItemError) return null;
    if (items.length === 0) { showToast('請至少新增一項卡池內容物', true); return null; }

    // 出卡紀錄
    var pullEntries = document.querySelectorAll('#pullsList .pull-entry');
    var pulls = [];
    var hasPullError = false;
    pullEntries.forEach(function(entry) {
        if (hasPullError) return;
        var grade = entry.querySelector('.pGrade').value;
        var type = entry.querySelector('.pType').value;
        var n = entry.querySelector('.pName').value.trim();
        var at = parseInt(entry.querySelector('.pAt').value) || 0;
        if (!grade && !type && !n && !at) return; // 空行跳過
        if (!grade) { focusEl(entry.querySelector('.pGrade'), '出卡紀錄缺少等級'); hasPullError = true; return; }
        if (!type) { focusEl(entry.querySelector('.pType'), '出卡紀錄缺少類型'); hasPullError = true; return; }
        if (!n) { focusEl(entry.querySelector('.pName'), '出卡紀錄缺少名稱'); hasPullError = true; return; }
        if (!at) { focusEl(entry.querySelector('.pAt'), '「' + n + '」的第幾抽出不能是 0'); hasPullError = true; return; }
        pulls.push({n:n, grade:grade, type:type, at:at});
    });
    if (hasPullError) return null;
    if (pulls.length === 0) { showToast('請至少填寫一筆出卡紀錄', true); return null; }

    // 花費
    var costData = getCostFormulas();
    var cPulls = costData.pulls || '0';
    var cDice = costData.dice || '0';
    var cStones = costData.stones || '0';

    var fromFmt = fmtDate(dateFrom);
    var toShort = shortDate(dateTo);
    var fy = dateFrom.split('-')[0], ty = dateTo.split('-')[0];
    var dateStr = fy === ty ? fromFmt + '-' + toShort : fromFmt + '-' + fmtDate(dateTo);

    return {
        date: dateStr, name: name, featured: featured,
        items: items, pulls: pulls,
        cost: { pulls:cPulls, dice:cDice, stones:cStones }
    };
}

function objToCode(obj) {
    if (!obj) return '';
    var lines = ['  {'];
    lines.push("    date:'" + obj.date + "', name:'" + obj.name + "', featured:'" + obj.featured + "',");
    lines.push('    items:[');
    obj.items.forEach(function(item) {
        lines.push("      {n:'" + item.n + "', grade:'" + item.grade + "', type:'" + item.type + "'},");
    });
    lines.push('    ],');
    lines.push('    pulls:[');
    obj.pulls.forEach(function(p) {
        lines.push("      {n:'" + p.n + "', grade:'" + p.grade + "', type:'" + p.type + "', at:" + p.at + "},");
    });
    lines.push('    ],');
    lines.push("    cost:{ pulls:'" + obj.cost.pulls + "', dice:'" + obj.cost.dice + "', stones:'" + obj.cost.stones + "' },");
    lines.push('  },');
    return lines.join('\n');
}

function generateCode() {
    var obj = buildBannerObj();
    if (!obj) return;
    document.getElementById('codeOutput').textContent = objToCode(obj);
    document.getElementById('previewSection').style.display = 'block';
    document.getElementById('previewSection').scrollIntoView({behavior:'smooth'});
    showToast('程式碼已產生');
}

// ============================
// 儲存到 NTE_data.js
// ============================
async function saveToData() {
    var obj = buildBannerObj();
    if (!obj) return;
    var code = objToCode(obj);
    try {
        var resp = await fetch('NTE_data.js?' + Date.now());
        var content = await resp.text();
        var lastBracket = content.lastIndexOf('];');
        if (lastBracket === -1) { showToast('NTE_data.js 格式異常，找不到 ];', true); return; }
        var newContent = content.substring(0, lastBracket) + code + '\n' + content.substring(lastBracket);
        var blob = new Blob([newContent], {type:'text/javascript;charset=utf-8'});
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'NTE_data.js';
        a.click();
        URL.revokeObjectURL(a.href);
        showToast('已下載更新後的 NTE_data.js，請替換原檔案');
    } catch(e) {
        showToast('將以下載方式提供更新的 NTE_data.js');
        document.getElementById('codeOutput').textContent = code;
        document.getElementById('previewSection').style.display = 'block';
        document.getElementById('previewSection').scrollIntoView({behavior:'smooth'});
    }
}

// ============================
// 複製 & 清空
// ============================
function copyCode() {
    var code = document.getElementById('codeOutput').textContent;
    try {
        var ta = document.createElement('textarea');
        ta.value = code; ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
        document.body.appendChild(ta); ta.focus(); ta.select();
        document.execCommand('copy'); ta.remove();
        showToast('已複製到剪貼簿');
    } catch(e) { showToast('複製失敗，請手動選取複製', true); }
}

function clearForm() {
    document.getElementById('fName').value = '';
    document.getElementById('fFeatured').value = '';
    document.getElementById('fDateFrom').value = '';
    document.getElementById('fDateTo').value = '';
    document.getElementById('itemsList').innerHTML = '';
    addItem();
    document.getElementById('pullsList').innerHTML = '';
    ntePullCount = 0;
    addPull();
    document.getElementById('costRounds').innerHTML = '';
    costRoundCount = 0;
    addCostRound();
    document.getElementById('previewSection').style.display = 'none';
    document.querySelectorAll('.has-value').forEach(function(el){ el.classList.remove('has-value'); });
    showToast('表單已清空');
}
